<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILD LOG — MAN / MYTH / LEGEND</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#050608;
  color:#ddd;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}

/* =========================================================
   BACKGROUND
========================================================= */

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at 50% 55%,
      rgba(90,150,175,.09),
      transparent 42%
    ),
    #050608;
}

#cone{
  position:absolute;
  width:100%;
  height:100%;
  opacity:.38;
}

/* cone */

.cone-edge{
  fill:none;
  stroke:#7aa7b5;
  stroke-width:1;
  opacity:.22;
}

.cone-ring{
  fill:none;
  stroke:#608692;
  stroke-width:1;
  opacity:.12;
}

.axis{
  stroke:#9cc5d0;
  stroke-width:1;
  opacity:.16;
  stroke-dasharray:4 8;
}

/* spiral */

.spiral{
  fill:none;
  stroke:#b4d5dd;
  stroke-width:1.5;
  opacity:.17;
}

/* nodes */

.node{
  fill:#071015;
  stroke:#75aebb;
  stroke-width:1;
}

.node-text{
  fill:#8daeb8;
  font-size:10px;
  letter-spacing:2px;
}

.node-year{
  fill:#566d74;
  font-size:8px;
  letter-spacing:1px;
}

/* labels */

.bg-label{
  fill:#4e6870;
  font-size:9px;
  letter-spacing:4px;
}

/* final convergence */

#convergence{
  fill:#dceef2;
  opacity:.75;
}

/* dark veil over background */

#veil{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(5,6,8,.96),
      rgba(5,6,8,.72) 25%,
      rgba(5,6,8,.55) 50%,
      rgba(5,6,8,.72) 75%,
      rgba(5,6,8,.96)
    );
}

/* =========================================================
   HEADER
========================================================= */

#header{
  position:fixed;
  top:18px;
  left:24px;
  right:24px;

  display:flex;
  justify-content:space-between;

  color:#60777e;
  font-size:9px;
  letter-spacing:2px;
}

/* =========================================================
   TERMINAL
========================================================= */

#terminal{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(920px,92vw);
  height:min(680px,86vh);

  display:flex;
  flex-direction:column;

  background:rgba(5,7,9,.91);

  border:
    1px solid
    rgba(130,180,195,.22);

  box-shadow:
    0 30px 100px rgba(0,0,0,.65);

  backdrop-filter:blur(14px);
}

/* terminal bar */

#bar{
  height:38px;
  flex:none;

  display:flex;
  align-items:center;

  padding:0 14px;

  border-bottom:
    1px solid
    rgba(130,180,195,.15);

  color:#61777e;
  font-size:10px;
}

.dot{
  width:7px;
  height:7px;
  margin-right:6px;

  border-radius:50%;
  background:#3b494e;
}

#path{
  margin-left:8px;
}

/* log */

#log{
  flex:1;

  overflow-y:auto;

  padding:
    25px
    28px
    35px;
}

/* entry */

.entry{
  margin-bottom:25px;

  max-width:820px;

  animation:
    appear .35s ease both;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* labels */

.label{
  display:inline-block;

  margin-bottom:8px;
  padding:4px 7px;

  border:1px solid rgba(130,180,195,.2);

  color:#8db3bd;

  font-size:9px;
  letter-spacing:2px;
}

.USER{
  color:#dfcf9c;
  border-color:rgba(223,207,156,.28);
}

.AI{
  color:#8dbdcc;
}

.PIVOT{
  color:#d5a16f;
}

.FAIL{
  color:#c87979;
}

.BUILD{
  color:#93bd83;
}

.RETURN{
  color:#a7a7a7;
}

.CRYSTALLIZE{
  color:#b6a2d0;
}

.SHIP{
  color:#fff;
  border-color:#fff;
}

/* prose */

.description{
  color:#d3d6d7;

  font-family:
    Inter,
    system-ui,
    sans-serif;

  font-size:15px;

  line-height:1.55;
}

/* actual prompt */

.prompt{
  margin-top:8px;

  padding-left:13px;

  border-left:
    2px solid
    #405e67;

  color:#eef0ee;

  font-size:12px;

  line-height:1.6;
}

.prompt::before{
  content:"> ";
  color:#688f9a;
}

/* footer */

#footer{
  flex:none;

  min-height:52px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  border-top:
    1px solid
    rgba(130,180,195,.15);

  color:#566a70;

  font-size:9px;
  letter-spacing:1px;
}

#next{
  appearance:none;

  padding:
    7px
    12px;

  background:transparent;

  border:
    1px solid
    rgba(130,180,195,.35);

  color:#9ab8c0;

  font:
    inherit;

  cursor:pointer;
}

#next:hover{
  background:
    rgba(130,180,195,.08);

  border-color:
    rgba(130,180,195,.6);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

  #header{
    left:13px;
    right:13px;
  }

  #terminal{
    width:96vw;
    height:88vh;
  }

  #log{
    padding:18px;
  }

  .description{
    font-size:14px;
  }

  #footer span{
    display:none;
  }

  #footer{
    justify-content:flex-end;
  }
}
</style>
</head>

<body>

<!-- =======================================================

======================================================= -->

<main id="terminal">

  <div id="bar">

    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

      stevo@career-convergence:~/build-log
    </span>

    </span>

    </button>

  </footer>

<script>

/* =========================================================
   JOURNAL DATA

   IMPORTANT:
   USER = user's actual idea / correction / decision
   AI   = assistant response
   BUILD = implementation
   FAIL = something genuinely broke
   PIVOT = direction changed
   RETURN = circle back
   CRYSTALLIZE = principle became clear
   SHIP = resulting direction
========================================================= */

const journal = [

  {
    type:"USER",

    description:
      "The CV needs to become an experience — not just a document.",

    prompt:
      "I want to rethink my CV."
  },


  {
    type:"AI",

    description:
      "The first attack is to stop treating the CV as a chronological document and make it navigable.",

    prompt:
      "Turn the career into an experience the reader can move through."
  },


  {
    type:"USER",

    description:
      "The opening becomes physical: a notebook being shuffled through.",

    prompt:
      "Starts with a video of shuffling through notebook."
  },


  {
    type:"BUILD",

    description:
      "The visual language starts forming around the bookmaker's office, race card and career coupon.",

    prompt:
      "Career Coupon 2026 / Runner no. 021283 / Legendary Race."
  },


  {
    type:"USER",

    description:
      "The abstract 'myth' isn't working. It needs to intersect with actual experience.",

    prompt:
      "myth part ... seems like AI slop — more crossing with concrete experience."
  },


  {
    type:"USER",

    description:
      "The first layer is deliberately stripped back to credentials.",

    prompt:
      "The man — CV entry ... bare metal."
  },


  {
    type:"USER",

    description:
      "MAN / MYTH / LEGEND is introduced as the architecture for the whole experience.",

    prompt:
      "MAN / MYTH / LEGEND."
  },


  {
    type:"AI",

    description:
      "The architecture is developed rather than invented: MAN can carry the visible record, MYTH the operating system, LEGEND the leverage.",

    prompt:
      "Build the three layers around what the candidate has done, how he operates, and what changes when he enters the room."
  },


  {
    type:"USER",

    description:
      "The abstract claims need hard evidence.",

    prompt:
      "Proof: HCCH Judgment Convention adoption (2019). Will add snapshots."
  },


  {
    type:"USER",

    description:
      "A physical transition mechanism is added between the layers.",

    prompt:
      "I also want UNO flip card between MAN / MYTH / LEGEND."
  },


  {
    type:"USER",

    description:
      "The UNO mechanic is sharpened: it should anticipate the reader's objection and steer the narrative before the objection becomes a rejection.",

    prompt:
      "UNO addressing questions and preemptively steering the narrative."
  },


  {
    type:"USER",

    description:
      "The career needs a spatial model: direction, moat, expanding vector, goalposts and milestones.",

    prompt:
      "A card with a sketch of cone directed in one direction — building moat and a circular ever expanding vector following with goalposts and milestones."
  },


  {
    type:"USER",

    description:
      "The central metaphor flips from uncertainty into accumulated convergence.",

    prompt:
      "When cone of uncertainty flips to the cone of convergent skill set maxxing."
  },


  {
    type:"USER",

    description:
      "The claim becomes explicit: the portfolio must prove more than competence in one discipline.",

    prompt:
      "Proof of work. Proof of flexibility. Proof of adaptability. Proof of stacking skills."
  },


  {
    type:"BUILD",

    description:
      "A Career Sniper prototype is built to visualize skills as targets.",

    prompt:
      "Career Sniper prototype."
  },


  {
    type:"FAIL",

    description:
      "The metaphor starts becoming the wrong story. Shooting skills makes the portfolio look like a matching game instead of a convergence story.",

    prompt:
      "Career Sniper isn't it."
  },


  {
    type:"PIVOT",

    description:
      "The mechanism is reframed as convergence rather than targeting.",

    prompt:
      "Career Convergence Engine."
  },


  {
    type:"CRYSTALLIZE",

    description:
      "The key mechanism becomes: each new domain removes an assumption about what the candidate is capable of.",

    prompt:
      "You don't shoot skills. You eliminate assumptions."
  },


  {
    type:"BUILD",

    description:
      "The sequence becomes LAW → CULTURE → GAMES → TECHNOLOGY → STRATEGY.",

    prompt:
      "Law → Culture → Games → Technology → Strategy."
  },


  {
    type:"FAIL",

    description:
      "Then the real build starts fighting back. Files upload, pages don't launch, one card works while the rest doesn't.",

    prompt:
      "It's just first card nothing else runs."
  },


  {
    type:"RETURN",

    description:
      "The process circles back instead of pretending the build is finished: inspect, verify, rebuild, test.",

    prompt:
      "Check the repo. Verify. Verify. Verify."
  },


  {
    type:"BUILD",

    description:
      "Multiple iterations are preserved. The failed versions become part of the development trail rather than disappearing.",

    prompt:
      "index1 → index2 → ... → index12 → convergence prototype."
  },


  {
    type:"USER",

    description:
      "The ending has to make the accumulated range mean something.",

    prompt:
      "Proof of work → proof of flexibility → proof of adaptability → proof of stacking skills."
  },


  {
    type:"USER",

    description:
      "The final positioning is not specialist versus generalist. It is the ability to connect domains.",

    prompt:
      "The end should wrap me up as the generalist ready for the future."
  },


  {
    type:"CRYSTALLIZE",

    description:
      "The disciplines stop reading as disconnected career detours and become a single operating capability.",

    prompt:
      "Law taught precision. Culture taught context. Games taught systems. Technology taught leverage."
  },


  {
    type:"SHIP",

    description:
      "The CV becomes the solution to the problem the build started with: how do you make a nonlinear career legible without flattening it?",

    prompt:
      "MAN / MYTH / LEGEND → PROOF OF WORK → GENERALIST / STRATEGIC OPERATOR."
  }

];


/* =========================================================
   ENGINE
========================================================= */

const log = document.getElementById("log");
const next = document.getElementById("next");
const sequence = document.getElementById("sequence");

let current = 0;


/* add one journal event */

function addEntry(item){

  const article =
    document.createElement("article");

  article.className = "entry";


  const label =
    document.createElement("div");

  label.className =
    "label " + item.type;

  label.textContent =
    item.type;


  const description =
    document.createElement("div");

  description.className =
    "description";

  description.textContent =
    item.description;


  const prompt =
    document.createElement("div");

  prompt.className =
    "prompt";

  prompt.textContent =
    item.prompt;


  article.appendChild(label);

  article.appendChild(description);

  article.appendChild(prompt);

  log.appendChild(article);


  /* always reveal latest event */

  log.scrollTop =
    log.scrollHeight;


  sequence.textContent =
    "SEQUENCE " +
    String(current + 1).padStart(2,"0") +
    " / " +
    item.type;


  if(current === journal.length - 1){

    next.textContent =
      "RESTART ↻";

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

next.addEventListener(
  "click",
  function(){

    if(current >= journal.length){

      current = 0;

      log.innerHTML = "";

      next.textContent =
        "NEXT →";
    }


    addEntry(
      journal[current]
    );

    current++;

  }
);


/* keyboard */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "ArrowRight" ||
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      next.click();

    }

  }
);


/* =========================================================
   START
========================================================= */

addEntry(
  journal[current]
);

current++;

</script>
