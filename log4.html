<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll → Cone</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070706;
  color:#eee;
  font-family:Georgia,serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  cursor:grab;
}

canvas.drag{
  cursor:grabbing;
}

#caption{
  position:fixed;
  left:34px;
  bottom:30px;
  pointer-events:none;
  transition:opacity .5s;
}

.eyebrow{
  font:9px monospace;
  letter-spacing:3px;
  color:rgba(255,255,255,.35);
}

h1{
  margin:8px 0 0;
  font-size:clamp(24px,4vw,48px);
  font-weight:400;
  letter-spacing:-1.5px;
}

#instruction{
  position:fixed;
  right:30px;
  bottom:30px;
  font:9px monospace;
  line-height:1.8;
  text-align:right;
  color:rgba(255,255,255,.35);
}

#phase{
  position:fixed;
  right:30px;
  top:28px;
  font:9px monospace;
  letter-spacing:2px;
  color:rgba(255,255,255,.3);
}

#phase strong{
  color:#eee;
  font-weight:400;
}

@media(max-width:700px){
  #caption{left:16px;bottom:18px}
  #instruction{display:none}
  #phase{right:16px;top:18px}
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="phase">
  PHASE / <strong id="phaseText">DRAWING</strong>
</div>

<div id="caption">
  <div class="eyebrow">THE CAREER OBJECT</div>
  <h1 id="title">A SHAPE BEFORE IT BECOMES SPACE.</h1>
</div>

<div id="instruction">
  DRAG — CHANGE ANGLE<br>
  SCROLL — MOVE<br>
  SPACE — ENTER<br>
  R — RESET
</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

  DPR=Math.min(2,devicePixelRatio||1);

  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   STATE

   0 = flat drawing
   1 = perspective beginning
   2 = 3D reveal
   3 = enter cone
========================================================= */

let reveal=0;
let entering=0;

let yaw=0;
let pitch=0;

let distance=18;

let dragging=false;
let lx=0;
let ly=0;


/* =========================================================
   EASING
========================================================= */

function ease(t){

  return t*t*(3-2*t);

}


/* =========================================================
   3D PROJECTION
========================================================= */

function project(p){

  let x=p.x;
  let y=p.y;
  let z=p.z;

  /* yaw */

  const cy=Math.cos(yaw);
  const sy=Math.sin(yaw);

  let xx=x*cy-z*sy;
  let zz=x*sy+z*cy;

  /* pitch */

  const cp=Math.cos(pitch);
  const sp=Math.sin(pitch);

  let yy=y*cp-zz*sp;
  let z2=y*sp+zz*cp;

  const depth=z2+distance;

  if(depth<.1)return null;

  const f=Math.min(W,H)*1.15;

  return {
    x:W/2+xx*f/depth,
    y:H/2-yy*f/depth,
    depth,
    scale:f/depth
  };
}


/* =========================================================
   2D VIOLIN SCROLL

   This is the visual starting point.

   It looks like a flat ornamental drawing.
========================================================= */

function scroll2D(){

  const pts=[];

  const turns=2.8;
  const steps=280;

  for(let i=0;i<steps;i++){

    const t=i/(steps-1);

    const a=t*turns*Math.PI*2;

    const r=22+190*t;

    pts.push({
      x:Math.cos(a)*r,
      y:Math.sin(a)*r
    });

  }

  return pts;
}


/* =========================================================
   SPIRAL BECOMES A SPATIAL CURVE

   The important trick:

   At reveal=0:

      x,y = flat drawing
      z   = 0

   At reveal=1:

      x,y,z = real spatial geometry

   So the viewer sees the 3D emerge
   from something they already understood.
========================================================= */

function spiral3D(t){

  const a=t*Math.PI*5.4;

  const r=.18+2.15*t;

  return {

    x:
      t*5.0,

    y:
      Math.cos(a)*r,

    z:
      Math.sin(a)*r

  };
}


/* =========================================================
   CONE

   The scroll becomes the narrow origin
   of an expanding application field.
========================================================= */

const CONE_LENGTH=11;
const CONE_RADIUS=5;


function coneRadius(x){

  return CONE_RADIUS*
    Math.pow(
      Math.max(0,x/CONE_LENGTH),
      1.08
    );

}


function conePoint(x,a){

  const r=coneRadius(x);

  return {
    x,
    y:Math.cos(a)*r,
    z:Math.sin(a)*r
  };

}


/* =========================================================
   DRAW 3D LINE
========================================================= */

function line3D(points,alpha,width=1){

  ctx.beginPath();

  let started=false;

  for(const p of points){

    const q=project(p);

    if(!q)continue;

    if(!started){

      ctx.moveTo(q.x,q.y);
      started=true;

    }else{

      ctx.lineTo(q.x,q.y);

    }

  }

  ctx.strokeStyle=
    `rgba(235,244,235,${alpha})`;

  ctx.lineWidth=width;
  ctx.stroke();

}


/* =========================================================
   DRAW FLAT SCROLL
========================================================= */

function drawFlatScroll(){

  const pts=scroll2D();

  ctx.save();

  ctx.translate(
    W/2,
    H/2
  );

  ctx.beginPath();

  for(let i=0;i<pts.length;i++){

    const p=pts[i];

    if(i===0)
      ctx.moveTo(p.x,p.y);
    else
      ctx.lineTo(p.x,p.y);

  }

  ctx.strokeStyle=
    "rgba(235,232,216,.8)";

  ctx.lineWidth=2;

  ctx.stroke();

  /* second contour */

  ctx.beginPath();

  for(let i=0;i<pts.length;i++){

    const p=pts[i];

    const scale=.93;

    if(i===0)
      ctx.moveTo(
        p.x*scale,
        p.y*scale
      );
    else
      ctx.lineTo(
        p.x*scale,
        p.y*scale
      );

  }

  ctx.strokeStyle=
    "rgba(235,232,216,.18)";

  ctx.lineWidth=1;

  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   SPIRAL REVEAL

   The flat drawing gradually acquires depth.
========================================================= */

function drawReveal(){

  const count=280;

  const points=[];

  for(let i=0;i<count;i++){

    const t=i/(count-1);

    const p=spiral3D(t);

    /*
      Flatten spatial geometry at the
      beginning of the reveal.
    */

    const flatX=
      (p.x-2.5)*45;

    const flatY=
      p.y*45;

    const flatZ=0;


    points.push({

      x:
        flatX*(1-reveal)+
        p.x*reveal,

      y:
        flatY*(1-reveal)+
        p.y*reveal,

      z:
        flatZ*(1-reveal)+
        p.z*reveal

    });

  }

  line3D(
    points,
    .9,
    2
  );

}


/* =========================================================
   CONE GRID
========================================================= */

function drawCone(){

  const rings=13;
  const meridians=34;

  /* longitudinal structure */

  for(let i=0;i<meridians;i++){

    const a=i/meridians*Math.PI*2;

    const pts=[];

    for(let j=0;j<=rings;j++){

      const x=j/rings*CONE_LENGTH;

      pts.push(
        conePoint(x,a)
      );

    }

    line3D(
      pts,
      .075,
      1
    );

  }


  /* cross sections */

  for(let j=1;j<=10;j++){

    const x=j/10*CONE_LENGTH;

    const pts=[];

    for(let i=0;i<=80;i++){

      const a=i/80*Math.PI*2;

      pts.push(
        conePoint(x,a)
      );

    }

    line3D(
      pts,
      .10,
      1
    );

  }


  /* outer silhouette */

  for(const a of [0,Math.PI]){

    const pts=[];

    for(let i=0;i<=80;i++){

      const x=i/80*CONE_LENGTH;

      pts.push(
        conePoint(x,a)
      );

    }

    line3D(
      pts,
      .20,
      1.5
    );

  }

}


/* =========================================================
   APPLICATION VECTOR

   One capability entering the field
   and expanding into possibilities.
========================================================= */

function drawVector(){

  const pts=[];

  for(let i=0;i<=100;i++){

    const t=i/100;

    const x=t*CONE_LENGTH;

    const a=
      -.7+
      t*Math.PI*2.2;

    pts.push(
      conePoint(
        x,
        a
      )
    );

  }

  line3D(
    pts,
    .28,
    1.5
  );

}


/* =========================================================
   NODES
========================================================= */

const nodes=[
  ["LAW","PRECISION",1.1,-.3],
  ["CULTURE","CONTEXT",3.2,.55],
  ["GAMES","SYSTEMS",5.4,-.55],
  ["TECH","LEVERAGE",7.7,.42],
  ["STRATEGY","APPLICATION",10,.15]
];


function drawNodes(){

  for(const n of nodes){

    const p=conePoint(
      n[2],
      n[3]
    );

    const q=project(p);

    if(!q)continue;

    const r=Math.max(
      2.5,
      4*q.scale
    );


    ctx.beginPath();

    ctx.arc(
      q.x,
      q.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#f2f5ed";
    ctx.fill();


    ctx.font=
      `${Math.max(8,10*q.scale)}px monospace`;

    ctx.textAlign="center";

    ctx.fillStyle=
      "rgba(240,245,238,.7)";

    ctx.fillText(
      n[0],
      q.x,
      q.y-r*2.2
    );


    ctx.font=
      `${Math.max(6,7*q.scale)}px monospace`;

    ctx.fillStyle=
      "rgba(240,245,238,.3)";

    ctx.fillText(
      n[1],
      q.x,
      q.y-r*.8
    );

  }

}


/* =========================================================
   ORIGIN
========================================================= */

function drawOrigin(){

  const q=project({
    x:0,
    y:0,
    z:0
  });

  if(!q)return;

  ctx.beginPath();

  ctx.arc(
    q.x,
    q.y,
    Math.max(3,5*q.scale),
    0,
    Math.PI*2
  );

  ctx.fillStyle="#fff";
  ctx.fill();

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  ctx.clearRect(
    0,0,W,H
  );


  /* paper-like beginning */

  const bg=
    ctx.createRadialGradient(
      W*.5,
      H*.48,
      0,
      W*.5,
      H*.48,
      Math.max(W,H)*.7
    );

  bg.addColorStop(
    0,
    "rgba(42,42,36,.15)"
  );

  bg.addColorStop(
    1,
    "rgba(0,0,0,.65)"
  );

  ctx.fillStyle=bg;

  ctx.fillRect(
    0,0,W,H
  );


  /*
    Phase 1:
    pure 2D.
  */

  if(reveal<.12){

    drawFlatScroll();

    return;
  }


  /*
    Phase 2:
    drawing starts becoming spatial.
  */

  drawReveal();


  /*
    Phase 3:
    cone slowly appears around it.
  */

  if(reveal>.35){

    const coneOpacity=
      ease(
        Math.min(
          1,
          (reveal-.35)/.65
        )
      );

    ctx.globalAlpha=
      coneOpacity;

    drawCone();
    drawVector();
    drawNodes();
    drawOrigin();

    ctx.globalAlpha=1;

  }

}


/* =========================================================
   AUTO TRANSITION

   Slowly turns the page from drawing
   into object.
========================================================= */

let auto=true;
let time=0;

function animate(){

  if(auto){

    time+=.003;

    /*
      First ~2/3:
      2D → 3D

      Then stop.

      User takes over.
    */

    if(time<1){

      reveal=
        ease(time);

    }else{

      auto=false;

    }

  }

  render();

  requestAnimationFrame(
    animate
  );

}

animate();


/* =========================================================
   INTERACTION
========================================================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    canvas.classList.add(
      "drag"
    );

    lx=e.clientX;
    ly=e.clientY;

    canvas.setPointerCapture(
      e.pointerId
    );

    auto=false;

  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    if(!dragging)return;

    const dx=e.clientX-lx;
    const dy=e.clientY-ly;

    lx=e.clientX;
    ly=e.clientY;


    /*
      Before reveal is complete,
      dragging the drawing changes
      its perspective.
    */

    reveal=Math.min(
      1,
      reveal+
      Math.abs(dx+dy)*.002
    );


    yaw-=dx*.006;
    pitch-=dy*.004;

    pitch=Math.max(
      -1.3,
      Math.min(
        1.3,
        pitch
      )
    );

  }
);


canvas.addEventListener(
  "pointerup",
  ()=>{

    dragging=false;

    canvas.classList.remove(
      "drag"
    );

  }
);


/* =========================================================
   SCROLL = APPROACH
========================================================= */

canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    auto=false;

    /*
      scrolling forward eventually
      carries the viewer into the cone.
    */

    distance+=
      e.deltaY*.012;

    distance=Math.max(
      4,
      Math.min(
        24,
        distance
      )
    );

    if(distance<8){

      entering=
        Math.min(
          1,
          entering+
          .04
        );

    }

  },
  {passive:false}
);


/* =========================================================
   SPACE = ENTER
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space"){

      e.preventDefault();

      auto=false;

      entering=1;

      distance=6;

      reveal=1;

    }


    if(e.key.toLowerCase()==="r"){

      reveal=0;
      entering=0;
      yaw=0;
      pitch=0;
      distance=18;

      auto=true;
      time=0;

    }

  }
);


/* =========================================================
   CAMERA FOLLOW

   Once inside, the camera begins
   travelling along the cone axis.
========================================================= */

setInterval(()=>{

  if(
    entering>.5 &&
    !dragging
  ){

    distance-=.025;

    if(distance<3.5)
      distance=3.5;

  }

},30);


/* =========================================================
   PHASE LABEL
========================================================= */

setInterval(()=>{

  const text=
    document.getElementById(
      "phaseText"
    );

  const title=
    document.getElementById(
      "title"
    );


  if(reveal<.2){

    text.textContent="DRAWING";

    title.textContent=
      "A SHAPE BEFORE IT BECOMES SPACE.";

  }
  else if(reveal<.65){

    text.textContent="REVEAL";

    title.textContent=
      "CHANGE THE ANGLE.";

  }
  else if(entering<.5){

    text.textContent="FIELD";

    title.textContent=
      "THE SHAPE OPENS.";

  }
  else{

    text.textContent="INSIDE";

    title.textContent=
      "FOLLOW THE VECTOR.";

  }

},100);

</script>

</body>
</html>
